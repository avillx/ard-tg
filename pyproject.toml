[project]
name = "ard-tg"
version = "1.2.0"
dependencies = [
    "attrs>=26.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pytelegrambotapi>=4.37.1"
]
requires-python = ">=3.15"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "agent*",
    "ard*",
    "attach*",
    "build*",
    "contacts*",
    "notifications*",
    "server*",
    "storage*",
    "telegram*",
]
