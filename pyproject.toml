[project]
name = "ard-tg"
version = "1.2.0"
dependencies = [
    "attrs>=26.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pytelegrambotapi>=4.37.1"
]
requires-python = ">=3.15"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.5",
    "basedpyright>=1.40.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "basic"
exclude = ["src/ard/**"]

[tool.ruff]
line-length = 100
target-version = "py315"

# cause it is a generated code
extend-exclude = ["src/ard","skills/"]

[tool.ruff.lint]
ignore = [
  "A003",    # flake8-builtins - class attribute {name} is shadowing a python builtin
  "B010",    # flake8-bugbear - do not call setattr with a constant attribute value
  "D100",    # pydocstyle - missing docstring in public module
  "D101",    # pydocstyle - missing docstring in public class
  "D102",    # pydocstyle - missing docstring in public method
  "D103",    # pydocstyle - missing docstring in public function
  "D104",    # pydocstyle - missing docstring in public package
  "D105",    # pydocstyle - missing docstring in magic method
  "D106",    # pydocstyle - missing docstring in public nested class
  "D107",    # pydocstyle - missing docstring in __init__
  "D202",    # pydocstyle - no blank lines allowed after function docstring
  "D205",    # pydocstyle - 1 blank line required between summary line and description
  "D415",    # pydocstyle - first line should end with a period, question mark, or exclamation point
  "E501",    # pycodestyle line too long, handled by ruff format
  "PLW2901", # pylint - for loop variable overwritten by assignment target
  "RUF012",  # Ruff-specific rule - annotated with classvar
  "ISC001",  # Ruff formatter incompatible
  "CPY001",  # ruff - copyright notice at the top of the file
  "SIM108",  # Use ternary operator
  "A005",    # Module shadows a built-in Python standard library module
  "PLC0415", # `import` should be at the top-level of a file
  "PLW1641", # Object does not implement `__hash__` method
  "SIM103",  # 'Return the condition directly': This is a bit overzealous
  "UP007",   # Use `X | Y` for type annotations
  "RET504"   # Unnecessary assignment before `return` statement
]

select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "DJ",  # flake8-django
    "DTZ", # flake8-datetimez
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "EXE", # flake8-executable
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # isort
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PLC", # pylint - convention
    "PLE", # pylint - error
    "PLW", # pylint - warning
    "PTH", # flake8-use-pathlib
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle - warning
    "YTT", # flake8-2020
]

[tool.ruff.lint.per-file-ignores]
# "docs/**/*.*" = ["S", "B", "DTZ", "A", "TC", "ERA", "D", "RET"]
# "docs/examples/**" = ["T201"]
# "docs/examples/application_hooks/before_send_hook.py" = ["UP006"]
# "docs/examples/data_transfer_objects**/*.*" = ["UP006"]
# "litestar/_openapi/schema_generation/schema.py" = ["C901"]
# "litestar/exceptions/*.*" = ["N818"]
# "litestar/handlers/**/*.*" = ["N801"]
# "litestar/handlers/websocket_handlers/listener.py" = ["B027"]
# "litestar/params.py" = ["N802"]
# "litestar/utils/predicates.py" = ["UP006", "UP035"]
# "litestar/utils/typing.py" = ["UP006", "UP035"]
# "test_apps/**/*.*" = ["D", "TRY", "EM", "S", "PTH"]
"tests/**/*.*" = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C901",
  "D",
  "DTZ",
  "EM",
  "FBT",
  "G",
  "N",
  "PGH",
  "PIE",
  "PLR",
  "PLW",
  "PTH",
  "RSE",
  "S",
  "S101",
  "SIM",
  "TC",
  "TRY",
  "E721",
  "UP045",
  "RUF043",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "agent*",
    "ard*",
    "attach*",
    "build*",
    "contacts*",
    "notifications*",
    "server*",
    "storage*",
    "telegram*",
]
